spring:
  application:
    name: sklep
  redis:
    host: localhost
    port: 6379
    password: kurs
    timeout: 2s
  cache:
    type: redis
management:
  endpoints:
    web:
      exposure:
        include: health,caches,configprops,env
  endpoint:
    health:
      show-details: always
    configprops:
      show-values: always
    env:
      show-values: always
