# Redis for the exercises: localhost:6379, password "kurs".
# Start: docker compose up -d   (or ./scripts/start-redis.sh)
name: kurs-redis
services:
  redis:
    image: redis:7.4-alpine
    container_name: kurs-redis
    command: ["redis-server", "--requirepass", "kurs", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
